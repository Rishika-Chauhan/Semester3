<!-- Assignment: Student management system, functionality:1. display a list of students, 2. add a new student, 3. edit student information, 4. delete a student, 5. search for a student by name . 6. filter student by branch, show total number of students ,7.display "no result found" when appropriate. use Html , internal css and javascript -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        h1 {
            text-align: center;
            height:30px;
            width :100%;
            background-color: darkgray;
            align-items: center;
            padding: 30px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
        .form-container {
            margin-bottom: 20px;
        }
        .form-container input, .form-container select {
            padding: 5px;
            margin-right: 10px;
        }
        .no-result {
            color: red;
            font-weight: bold;
        }
        button{
            padding: 5px 10px;
            background-color: green;
            color: white;
            cursor:pointer;
        }
        button:hover{
            background-color: darkgreen;

        }
    </style>
   <script>
        let students = [];
        let studentIdCounter = 1;

        function addStudent() {
            const nameInput = document.getElementById('nameInput');
            const branchInput = document.getElementById('branchInput');
            const name = nameInput.value.trim();
            const branch = branchInput.value.trim();

            if (name && branch) {
                const student = { id: studentIdCounter++, name, branch };
                students.push(student);
                nameInput.value = '';
                branchInput.value = '';
                renderStudentTable();
            } else {
                alert('Please enter both name and branch.');
            }
        }

        function editStudent(id) {
            const student = students.find(s => s.id === id);
            if (student) {
                const newName = prompt('Enter new name:', student.name);
                const newBranch = prompt('Enter new branch:', student.branch);
                if (newName && newBranch) {
                    student.name = newName.trim();
                    student.branch = newBranch.trim();
                    renderStudentTable();
                }
            }
        }

        function deleteStudent(id) {
            students = students.filter(s => s.id !== id);
            renderStudentTable();
        }

        function renderStudentTable() {
            const tableBody = document.getElementById('studentTableBody');
            tableBody.innerHTML = '';
            const searchQuery = document.getElementById('searchInput').value.toLowerCase();
            const selectedBranch = document.getElementById('branchFilter').value;

            let filteredStudents = students.filter(student => 
                student.name.toLowerCase().includes(searchQuery) &&
                (selectedBranch === '' || student.branch === selectedBranch)
            );

            if (filteredStudents.length === 0) {
                document.getElementById('noResult').style.display = 'block';
            } else {
                document.getElementById('noResult').style.display = 'none';
                filteredStudents.forEach(student => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${student.id}</td>
                        <td>${student.name}</td>
                        <td>${student.branch}</td>
                        <td>
                            <button onclick="editStudent(${student.id})">Edit</button>
                            <button onclick="deleteStudent(${student.id})">Delete</button>
                        </td>
                    `;
                    tableBody.appendChild(row);
                });
            }
        }
    </script>
</head> 
<body>
    <h1>Student Management System</h1>
    <div class="form-container">
       
        
            <div class="form-container">
            <input type="text" id="nameInput" placeholder="Student Name">
        <select id="branchFilter">
            <option value="">All Branches</option>
            <option value="CSE DS">Computer Science-Data Science</option>
            <option value="CSE AIML">Computer Science-AI & ML</option>
            <option value="CSE">Computer Science-Core</option>
        
        </select>
        <button onclick="addStudent()">Add</button>
    </div>
    </div>
    <div class="form-container">
        <input type="text" id="searchInput" placeholder="Search by name" >
        <select id="branchFilter">
            <option value="">All Branches</option>
            <option value="CSE DS">Computer Science-Data Science</option>
            <option value="CSE AIML">Computer Science-AI & ML</option>
            <option value="CSE">Computer Science-Core</option>
        
        </select>
    </div>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Branch</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="studentTableBody"></tbody>
    </table>
    <div id="noResult" class="no-result" style="display:none;">No result found</div>
    <div id="totalStudents">Total Students: 0</div>

    <script>
        document.getElementById('searchInput').addEventListener('input', renderStudentTable);
        document.getElementById('branchFilter').addEventListener('change', renderStudentTable);

        function updateTotalStudents() {
            document.getElementById('totalStudents').textContent = `Total Students: ${students.length}`;
        }

        function renderStudentTable() {
            const tableBody = document.getElementById('studentTableBody');
            tableBody.innerHTML = '';
            const searchQuery = document.getElementById('searchInput').value.toLowerCase();
            const selectedBranch = document.getElementById('branchFilter').value;

            let filteredStudents = students.filter(student => 
                student.name.toLowerCase().includes(searchQuery) &&
                (selectedBranch === '' || student.branch === selectedBranch)
            );

            if (filteredStudents.length === 0) {
                document.getElementById('noResult').style.display = 'block';
            } else {
                document.getElementById('noResult').style.display = 'none';
                filteredStudents.forEach(student => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${student.id}</td>
                        <td>${student.name}</td>
                        <td>${student.branch}</td>
                        <td>
                            <button onclick="editStudent(${student.id})">Edit</button>
                            <button onclick="deleteStudent(${student.id})">Delete</button>
                        </td>
                    `;
                    tableBody.appendChild(row);
                });
            }
            updateTotalStudents();
        }
    </script>
</body>
</html>
