<!-- Assignment: Student management system, functionality:1. display a list of students, 2. add a new student, 3. edit student information, 4. delete a student, 5. search for a student by name . 6. filter student by branch, show total number of students ,7.display "no result found" when appropriate. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
</head>
<body>
    <h1>Student Management System</h1>
    <p>This is a simple student management system by Rishika Chauhan.</p>
    <form id="studentForm">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>
        <label for="branch">Branch:</label>
        <input type="text" id="branch" name="branch" required>
        <button type="submit">Add Student</button>
    </form>
    <input type="text" id="search" placeholder="Search by name">
    <select id="filterBranch">
        <option value="">Filter by branch</option>
        <option value="Computer Science">Computer Science</option>
        <option value="Electrical">Electrical</option>
        <option value="Mechanical">Mechanical</option>
    </select>
    <p id="totalStudents">Total Students: 0</p>
    <div id="studentList">
        

    </div>  

</body>
</html>
